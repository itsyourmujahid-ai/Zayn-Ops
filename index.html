<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/zayn-logo.svg" />
    <title>ZaynOps - Enterprise Sales CRM</title>
    <meta name="description" content="ZaynOps - Enterprise sales CRM and multi-company operations platform with role-based access control, appointment &amp; pipeline tracking, and immutable audit logs." />
    <meta property="og:title" content="ZaynOps - Enterprise Sales CRM" />
    <meta property="og:description" content="ZaynOps - Enterprise sales CRM and multi-company operations platform with role-based access control, appointment &amp; pipeline tracking, and immutable audit logs." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('zaynops_theme') || localStorage.getItem('zaynos_theme');
          if (!theme || theme === 'obsidian-gold' || theme === 'midnight-navy' || theme === 'emerald-noir') {
            theme = 'zaynops-light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
